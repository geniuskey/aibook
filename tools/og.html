<!doctype html>
<!-- og.png 원본. python3 tools/og.py 가 1200×630 으로 캡처한다. tools/ 는 배포에서 제외된다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AIBook OG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative; color: #e6ebf5;
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif;
    background:
      radial-gradient(ellipse 50% 70% at 78% 50%, rgba(110, 86, 207, .28), transparent 70%),
      radial-gradient(ellipse 35% 45% at 95% 95%, rgba(214, 64, 159, .18), transparent 70%),
      #0b0f17;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font: 600 15px "JetBrains Mono", monospace; letter-spacing: .16em; color: #a18cff; }
  .name { display: flex; align-items: center; gap: 16px; margin-top: 22px; font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .name svg { width: 44px; height: 44px; }
  h1 { margin: 18px 0 0; font-size: 64px; line-height: 1.14; letter-spacing: -.045em; font-weight: 800; }
  h1 span { background: linear-gradient(90deg, #a18cff, #f067b4); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lede { margin: 24px 0 0; color: #9aa6bf; font-size: 21px; line-height: 1.55; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 26px; }
  .chips span { padding: 6px 13px; border-radius: 999px; border: 1px solid #273248; background: #121826; color: #c3cbe0; font-size: 15px; }
  .url { position: absolute; left: 72px; bottom: 36px; font: 500 15px "JetBrains Mono", monospace; color: #69748c; letter-spacing: .04em; }
  .art { position: absolute; right: 40px; top: 65px; width: 520px; height: 500px; }
  .art text { font: 600 15px "Pretendard Variable", sans-serif; fill: #e6ebf5; }
</style>
</head>
<body>
  <section class="copy">
    <div class="eyebrow">INTERACTIVE AI TEXTBOOK</div>
    <div class="name"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e56cf"/><stop offset="1" stop-color="#d6409f"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="8" fill="url(#g)"/><g stroke="#fff" stroke-width="1.5" opacity=".7" fill="none"><path d="M9 10L16 16L9 22M23 10L16 16L23 22M9 10L23 10M9 22L23 22"/></g><g fill="#fff"><circle cx="9" cy="10" r="2.5"/><circle cx="9" cy="22" r="2.5"/><circle cx="23" cy="10" r="2.5"/><circle cx="23" cy="22" r="2.5"/><circle cx="16" cy="16" r="3.2"/></g></svg>AIBook</div>
    <h1>벡터 하나에서<br><span>대규모 언어 모델까지</span></h1>
    <p class="lede">임베딩을 돌리고 어텐션을 손으로 고치며<br>Transformer와 LLM을 바닥부터 배우는 교과서</p>
    <div class="chips"><span>13개 챕터</span><span>100+ 시뮬레이터</span><span>양자화 · RAG · 에이전트</span></div>
  </section>
  <div class="url">aibook.euiyun.com</div>
  <svg class="art" id="art" viewBox="0 0 520 500" aria-hidden="true"></svg>
<script>
(async () => {
  // 홈 히어로의 임베딩 공간: 의미가 비슷한 단어끼리 모이고, 토큰 사이에 어텐션 호가 걸린다.
  const art = document.getElementById("art");
  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const gauss = () => { let s = 0; for (let i = 0; i < 4; i++) s += rnd(); return s - 2; };
  const clusters = [
    { x: 150, y: 120, c: "#7aa7ff", words: [["고양이", -34, -26], ["강아지", 40, 16]] },
    { x: 410, y: 160, c: "#f5c84c", words: [["김치", -24, -22], ["사과", 30, 18]] },
    { x: 130, y: 360, c: "#4fd1b5", words: [["서울", -30, -18], ["도쿄", 34, 22]] },
    { x: 360, y: 390, c: "#f06fb4", words: [["달린다", -40, -24], ["앉았다", 30, 26]] },
  ];
  let s = `<g stroke="#9aa6bf" stroke-opacity=".22" stroke-width="1.2"><line x1="40" y1="250" x2="490" y2="250"/><line x1="260" y1="30" x2="260" y2="480"/><line x1="70" y1="420" x2="460" y2="90"/></g>`;
  const arcs = [[[360, 390], [150, 120]], [[360, 390], [130, 360]], [[150, 120], [410, 160]]];
  arcs.forEach(([[x1, y1], [x2, y2]], i) => {
    const mx = (x1 + x2) / 2 + (i === 1 ? 0 : 40), my = Math.min(y1, y2) - 70;
    s += `<path d="M${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}" fill="none" stroke="#c4a6ff" stroke-opacity="${.75 - i * .2}" stroke-width="${3 - i * .7}"/>`;
  });
  clusters.forEach((k) => {
    for (let i = 0; i < 70; i++) {
      const x = k.x + gauss() * 34, y = k.y + gauss() * 30, r = 2 + rnd() * 3;
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${k.c}" fill-opacity="${(.45 + rnd() * .5).toFixed(2)}"/>`;
    }
    s += `<circle cx="${k.x}" cy="${k.y}" r="7" fill="${k.c}" stroke="#0b0f17" stroke-width="2"/>`;
    k.words.forEach(([w, dx, dy]) => {
      const w2 = w.length * 15 + 18;
      s += `<g transform="translate(${k.x + dx - w2 / 2} ${k.y + dy - 15})"><rect width="${w2}" height="28" rx="7" fill="#121826" fill-opacity=".92" stroke="#273248"/><text x="${w2 / 2}" y="19" text-anchor="middle">${w}</text></g>`;
    });
  });
  s += `<g transform="translate(250 228)"><rect width="230" height="30" rx="8" fill="#1a1530" stroke="#6e56cf"/><text x="115" y="20" text-anchor="middle" style="font-size:14px">어텐션 '앉았다' → '고양이'</text></g>`;
  art.innerHTML = s;
  await document.fonts.ready;
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
